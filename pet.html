<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:">
<title>Claude Pet</title>
<style>
  /* 상태별 색 */
  :root {
    --c-working: #E06A40;
    --c-waiting: #E8930C;
    --c-done: #2F9E63;
    --c-failed: #D64545;
    --bubble-bg: rgba(255, 255, 255, 0.97);
    --bubble-text: #2B2622;
    --bubble-sub: #6F6862;
    --bubble-line: rgba(0, 0, 0, 0.10);
    --pet-left: 0px;          /* 창 왼쪽 끝에서 펫까지 (본체가 정해 준다) */
    --panel-offset: 150px;    /* 창 끝에서 말풍선까지 (펫 높이 + 여백) */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bubble-bg: rgba(38, 36, 34, 0.97);
      --bubble-text: #F3EFEA;
      --bubble-sub: #B5ADA5;
      --bubble-line: rgba(255, 255, 255, 0.14);
    }
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    user-select: none; -webkit-user-select: none; cursor: default;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  /* 창 전체. 펫은 창 아래쪽에, 말풍선은 그 위에 둔다. body.below면 위아래가 뒤집힌다 */
  #stage { position: fixed; inset: 0; }
  #petwrap { position: absolute; left: var(--pet-left); bottom: 0; }
  body.below #petwrap { bottom: auto; top: 0; }
  #panel {
    position: absolute; left: 0; bottom: var(--panel-offset);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: max-content; max-width: 280px;
  }
  body.below #panel { bottom: auto; top: var(--panel-offset); flex-direction: column-reverse; }
  /* 말풍선 */
  #bubble {
    position: relative; box-sizing: border-box; min-width: 110px; max-width: 264px; padding: 7px 12px 8px;
    background: var(--bubble-bg); color: var(--bubble-text); border: 1px solid var(--bubble-line);
    border-radius: 14px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.20); cursor: pointer;
    --tail-x: 50%;
  }
  #bubble:hover { border-color: var(--c-working); }
  #bubble::after {
    content: ""; position: absolute; left: var(--tail-x); bottom: -6px; width: 10px; height: 10px; margin-left: -5px;
    background: var(--bubble-bg); border-right: 1px solid var(--bubble-line); border-bottom: 1px solid var(--bubble-line);
    transform: rotate(45deg);
  }
  body.below #bubble::after {
    bottom: auto; top: -6px; border-right: none; border-bottom: none;
    border-left: 1px solid var(--bubble-line); border-top: 1px solid var(--bubble-line);
  }
  .b-main { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .b-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c-working); }
  .b-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b-more { flex: none; margin-left: auto; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--bubble-line); color: var(--bubble-sub); }
  .b-more:hover { color: var(--bubble-text); }
  .b-sub { margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: var(--bubble-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-state="working"] .b-dot, .row[data-state="working"] .r-dot { background: var(--c-working); }
  [data-state="waiting"] .b-dot, .row[data-state="waiting"] .r-dot { background: var(--c-waiting); }
  [data-state="done"] .b-dot, .row[data-state="done"] .r-dot { background: var(--c-done); }
  [data-state="failed"] .b-dot, .row[data-state="failed"] .r-dot { background: var(--c-failed); }
  [data-state="working"] .b-dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  /* 세션 목록의 모양 */
  #list {
    box-sizing: border-box; background: var(--bubble-bg); color: var(--bubble-text);
    border: 1px solid var(--bubble-line); border-radius: 14px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.20);
  }
  #list { width: 264px; padding: 6px; overflow: hidden; }
  .list-title { padding: 2px 6px 4px; font-size: 11px; color: var(--bubble-sub); }
  .row { display: flex; align-items: flex-start; gap: 7px; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--bubble-line); }
  .r-dot { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; }
  .r-body { min-width: 0; flex: 1; }
  .r-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-detail { font-size: 11.5px; line-height: 1.35; color: var(--bubble-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-time { flex: none; font-size: 11px; line-height: 1.6; color: var(--bubble-sub); }
  /* 펫 */
  #pet { position: relative; transform-origin: 50% 100%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.28)); cursor: pointer; }
  #pet.dragging { cursor: grabbing; }
  /* 시트를 보여 주는 두 겹. 프레임이 바뀔 때 새 그림을 위에 겹쳐 서서히 드러낸다 */
  .layer { position: absolute; inset: 0; background-repeat: no-repeat; pointer-events: none; }
  /* 3D 펫을 그리는 캔버스 (이미지 펫일 때는 숨긴다) */
  #pet3d { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #petEmpty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; background: rgba(60, 56, 52, 0.85); border-radius: 16px; text-align: center; pointer-events: none; }
  /* 상태 배지 */
  #badge {
    position: absolute; top: 2px; right: 2px; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 5px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    border-radius: 11px; color: #fff; font-size: 13px; font-weight: 700; line-height: 1;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); pointer-events: none;
  }
  #badge[data-state="working"] { background: var(--c-working); }
  #badge[data-state="waiting"] { background: var(--c-waiting); animation: pop 0.9s ease-in-out infinite; }
  #badge[data-state="done"] { background: var(--c-done); }
  #badge[data-state="failed"] { background: var(--c-failed); }
  #badge i { width: 4px; height: 4px; border-radius: 50%; background: #fff; animation: dots 1.1s ease-in-out infinite; }
  #badge i:nth-child(2) { animation-delay: 0.18s; }
  #badge i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes dots { 0%, 60%, 100% { opacity: 0.4; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  /* 3D 펫일 때는 말풍선 점과 배지의 깜빡임을 3D를 그리는 순간에 함께 갱신한다 (syncBlink).
     따로 돌리면 화면을 다시 합치는 횟수가 두 배가 되어 CPU를 코어 1개의 5%쯤 더 쓴다 */
  body.three .b-dot, body.three #badge, body.three #badge i { animation: none !important; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div id="list" class="hit" hidden></div>
    <div id="bubble" class="hit" title="클릭하면 이 세션을 Claude에서 엽니다" hidden>
      <div class="b-main"><span class="b-dot"></span><span class="b-text" id="bubbleText"></span><span class="b-more" id="bubbleMore" title="세션 목록 보기" hidden></span></div>
      <div class="b-sub" id="bubbleSub"></div>
    </div>
  </div>
  <div id="petwrap">
    <div id="pet" class="hit" title="클릭하면 Claude를 엽니다"><div class="layer" id="layerA"></div><div class="layer" id="layerB"></div><canvas id="pet3d" hidden></canvas><div id="petEmpty" hidden>펫을 찾을 수 없어요</div></div>
    <div id="badge" hidden></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="pet3d.js"></script>
<script>
'use strict';
(function () {
  // ── 설정 상수 ─────────────────────────────────────────────
  const BASE_ANIMATION = { idle: 'idle', working: 'running', waiting: 'waiting', done: 'review', failed: 'failed' };
  // 3D 펫
  const SUPERSAMPLE_3D = 2;           // 픽셀당 표본 수(한 변). 가장자리를 매끄럽게 한다
  const DEFAULT_FPS_3D = { idle: 30, busy: 60 };   // 본체가 값을 안 줬을 때의 초당 그리는 횟수
  const FRAME_SLACK_MS = 2;           // 그릴 때가 됐는지 판정할 때의 여유
  const MAX_3D_ERRORS = 2;            // 연달아 이만큼 그리기에 실패하면 이미지 펫으로 되돌린다
  const TRAY_ICON_PX = 64;            // 알림 영역 아이콘용으로 보내는 그림의 한 변 (본체가 16, 32로 줄여 쓴다)
  const TRAY_RENDER_SCALE = 1;        // 아이콘을 그릴 때의 배율 (칸 1픽셀당 픽셀 수)
  const TRAY_ICON_DELAY_MS = 500;     // 색이 바뀐 뒤 아이콘을 보내기까지 기다리는 시간
  // 3D 펫일 때 직접 계산하는 깜빡임 (CSS 애니메이션과 같은 주기와 크기)
  const BLINK = {
    pulseS: 1.2, pulseLow: 0.35,                 // 말풍선 점: 주기(초), 가장 흐릴 때의 불투명도
    popS: 0.9, popScale: 1.18,                   // 확인 필요 배지: 주기, 가장 커졌을 때의 배율
    dotsS: 1.1, dotsDelayS: 0.18, dotsLow: 0.4, dotsRisePx: 2,   // 작업 중 배지의 점 세 개: 주기, 점마다 늦는 시간, 흐릴 때 불투명도, 솟는 높이
  };
  const DRAG_THRESHOLD_PX = 4;        // 이만큼 움직여야 드래그로 본다 (그 안쪽이면 클릭)
  const CLOCK_MS = 1000;              // 경과 시간 갱신 주기
  const LIST_ROW_HEIGHT = 46;         // 목록 한 줄 높이 (남은 공간 계산용)
  const LIST_CHROME_HEIGHT = 36;      // 목록 제목과 여백
  const PANEL_GAP_PX = 4;             // 펫과 말풍선 사이
  const EDGE_MARGIN_PX = 4;           // 말풍선과 창 끝 사이
  const TAIL_MARGIN_PX = 18;          // 말풍선 꼬리가 모서리에 붙지 않게 하는 여백
  // 부드러운 움직임: 프레임 겹쳐 넘기기
  const FADE_MS = 90;                 // 새 프레임이 드러나는 데 걸리는 최대 시간
  const FADE_RATIO = 0.6;             // 프레임 표시 시간 중 겹침에 쓰는 비율 (짧은 프레임에서 겹침이 밀리지 않게)
  const LOOK_FADE_MS = 110;           // 바라보는 방향이 바뀔 때의 겹침 시간
  // 부드러운 움직임: 탄력 (몸 전체를 눌렀다 늘리고, 띄우고, 기울인다)
  const SQUASH_STIFFNESS = 180;       // 눌림 스프링의 세기와 감쇠
  const SQUASH_DAMPING = 12;
  const LEAN_STIFFNESS = 140;         // 기울임 스프링의 세기와 감쇠
  const LEAN_DAMPING = 11;
  const SQUASH_MIN = 0.72;            // 눌림·늘어남 한도
  const SQUASH_MAX = 1.28;
  const LEAN_MAX_DEG = 8;             // 끌 때 기울어지는 최대 각도
  const LEAN_PER_SPEED = 0.012;       // 끄는 속도(px/초)당 기울기(도)
  const LEAN_HOLD_MS = 90;            // 끌다 멈추면 이 시간 뒤 기울임을 푼다
  const DRAG_TICK_S = 0.016;          // 본체가 끌기 이동을 알려 주는 간격
  const HOP_DELAY_MS = 140;           // 완료 점프: 움츠린 뒤 뛰기까지
  const HOP_AIR_MS = 420;             // 완료 점프: 떠 있는 시간
  const HOP_HEIGHT_RATIO = 0.08;      // 완료 점프: 펫 높이 대비 뛰는 높이
  const KICK_ANTICIPATE = 1.2;        // 상황별 눌림 세기
  const KICK_LAND = 1.6;
  const KICK_RELEASE = 1.4;
  const KICK_CLICK = 1.0;
  const KICK_NOTICE = 0.8;
  const SOUND_VOLUME = 0.07;
  const SOUNDS = {
    done: [[660, 0, 0.12], [880, 0.11, 0.12], [1320, 0.22, 0.22]],
    waiting: [[880, 0, 0.09], [880, 0.16, 0.12]],
    failed: [[330, 0, 0.16], [247, 0.15, 0.26]],
  };
  const EMPTY_SUMMARY = { primary: null, sessions: [], total: 0, counts: { working: 0, waiting: 0, done: 0, failed: 0 } };
  const STATE_KEYS = ['idle', 'working', 'waiting', 'done', 'failed'];

  // 지금 언어의 문구를 꺼낸다 (i18n.js를 못 읽었으면 열쇠를 그대로 보여 준다)
  function T(key, ...args) {
    return window.I18N ? window.I18N.t(settings.lang || 'ko', key, ...args) : key;
  }

  // 고정된 안내 문구(마우스를 올리면 나오는 설명 등)를 지금 언어로 바꾼다
  function applyTexts() {
    document.documentElement.lang = settings.lang || 'ko';
    el.pet.title = T('pet.tipPet');
    el.bubble.title = T('pet.tipBubble');
    el.bubbleMore.title = T('pet.tipMore');
    el.petEmpty.textContent = T('pet.none');
  }

  // 상태별 말풍선 제목
  function stateLabels() {
    const out = {};
    for (const s of STATE_KEYS) out[s] = T(`state.${s}`);
    return out;
  }

  // ── 화면 요소 ─────────────────────────────────────────────
  const el = {
    pet: document.getElementById('pet'),
    layers: [document.getElementById('layerA'), document.getElementById('layerB')],
    petEmpty: document.getElementById('petEmpty'),
    badge: document.getElementById('badge'),
    panel: document.getElementById('panel'),
    bubble: document.getElementById('bubble'),
    bubbleText: document.getElementById('bubbleText'),
    bubbleDot: document.querySelector('#bubble .b-dot'),
    bubbleSub: document.getElementById('bubbleSub'),
    bubbleMore: document.getElementById('bubbleMore'),
    list: document.getElementById('list'),
    canvas: document.getElementById('pet3d'),
  };
  const rootStyle = document.documentElement.style;
  const api = window.petApi;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── 실행 중 상태 ──────────────────────────────────────────
  let settings = { sound: true, bubble: true, smooth: true, lang: 'ko' };
  let activeLayer = 0;           // 지금 그림을 보여 주는 겹의 번호
  let fadeAnimations = [];       // 진행 중인 겹침 애니메이션
  let currentCell = '';          // 지금 보여 주는 칸의 위치 문자열
  // 탄력 계산용 값 (x: 현재값, v: 속도, to: 목표값)
  const motion = {
    squash: { x: 1, v: 0, to: 1, k: SQUASH_STIFFNESS, c: SQUASH_DAMPING },
    lean: { x: 0, v: 0, to: 0, k: LEAN_STIFFNESS, c: LEAN_DAMPING },
    y: 0, vy: 0, gravity: 0, airborne: false,
    frame: null, last: 0, leanAt: 0, hopTimer: null,
  };
  let layout = { petWidth: 134, petHeight: 146, petLeft: 0, below: false, panelMaxHeight: 300 };
  let pet = null;                // 현재 펫 정보 (본체가 보냄)
  let animations = {};           // 이름 → { row, frames, durations }
  let sheetReady = false;
  let summary = EMPTY_SUMMARY;
  let listOpen = false;
  let look = { active: false, index: null, dx: 0, dy: 0 };
  // 3D 펫 그리기 상태
  const three = {
    renderer: null, actor: null, ready: false,
    frame: null, lastDraw: 0, drawn: 0, errors: 0, lostBound: false,
    basePixels: null, size: 0,     // 원래 색 지도의 픽셀과 한 변 크기
    pixels: null, rgb: null,       // 지금 입힌 색 지도의 픽셀과 그 색 (아이콘을 그릴 때 다시 쓴다)
    iconTimer: null,
    color: null,                   // 지금 입힌 색 ("#rrggbb"). null이면 원래 색
    pendingColor: undefined,       // 다음 그릴 때 입힐 색 (끄는 동안 한 프레임에 한 번만 계산한다)
    fps: DEFAULT_FPS_3D, lastPose: null,
    seen: null,                    // 점검용 관측값 (newSeen 참고)
  };
  // 점검용 관측값의 처음 상태
  function newSeen() {
    return { minSy: Infinity, maxSy: -Infinity, maxShear: 0, maxLiftPx: 0, maxSmile: 0, maxLid: 0, minOpen: 1 };
  }
  three.seen = newSeen();
  let dragDirection = null;      // 드래그 중이면 'left' | 'right'
  let dragging = false;
  let pointerDown = null;
  let ignoringMouse = true;
  let oneShot = null;            // 한 번만 재생 중인 애니메이션 이름
  let loopId = null;             // 반복 재생 중인 애니메이션 이름
  let frameTimer = null;
  let audioContext = null;
  let greeted = false;

  // ── 스프라이트 재생 ───────────────────────────────────────
  // 부드러운 움직임을 쓸 수 있는지
  function smoothEnabled() {
    return !!settings.smooth && !reducedMotion;
  }

  // 진행 중인 겹침을 끝내고 현재 겹만 보이게 한다
  function stopFade() {
    for (const animation of fadeAnimations) {
      try { animation.cancel(); } catch (_) { /* 이미 끝난 애니메이션 */ }
    }
    fadeAnimations = [];
    el.layers[activeLayer].style.opacity = '1';
    el.layers[1 - activeLayer].style.opacity = '0';
  }

  // 시트의 한 칸을 보여 준다. fadeMs가 있으면 이전 그림 위에 겹쳐 서서히 드러낸다
  function showCell(row, col, fadeMs) {
    const position = `${-col * layout.petWidth}px ${-row * layout.petHeight}px`;
    if (position === currentCell) return;
    const first = currentCell === '';
    stopFade();
    currentCell = position;
    const current = el.layers[activeLayer];
    if (first || !smoothEnabled() || !(fadeMs > 0) || typeof current.animate !== 'function') {
      current.style.backgroundPosition = position;
      return;
    }
    const next = el.layers[1 - activeLayer];
    next.style.backgroundPosition = position;
    next.style.zIndex = '2';
    current.style.zIndex = '1';
    try {
      // 새 그림은 처음부터 드러나고, 이전 그림은 절반까지 버티다 사라진다 (겹치는 동안 몸이 비쳐 보이지 않게)
      const fadeIn = next.animate([{ opacity: 0 }, { opacity: 1 }], { duration: fadeMs, easing: 'ease-out', fill: 'forwards' });
      const fadeOut = current.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.5 }, { opacity: 0, offset: 1 }], { duration: fadeMs, fill: 'forwards' });
      fadeAnimations = [fadeIn, fadeOut];
      activeLayer = 1 - activeLayer;
      fadeIn.onfinish = stopFade;
    } catch (e) {
      console.error(`프레임 겹침 실패: ${e.message}`);
      fadeAnimations = [];
      current.style.backgroundPosition = position;
      current.style.opacity = '1';
      next.style.opacity = '0';
    }
  }

  // ── 탄력 ──────────────────────────────────────────────────
  // 스프링 하나를 한 단계 진행한다
  function stepSpring(s, dt) {
    s.v += (-s.k * (s.x - s.to) - s.c * s.v) * dt;
    s.x += s.v * dt;
  }

  // 탄력 값을 처음 상태로 되돌리고 변형을 지운다
  function resetMotion() {
    clearTimeout(motion.hopTimer);
    if (motion.frame) cancelAnimationFrame(motion.frame);
    motion.frame = null;
    motion.squash.x = 1; motion.squash.v = 0;
    motion.lean.x = 0; motion.lean.v = 0; motion.lean.to = 0;
    motion.y = 0; motion.vy = 0; motion.airborne = false;
    el.pet.style.transform = '';
  }

  // 탄력 계산을 한 프레임 진행한다. 움직임이 가라앉으면 스스로 멈춘다
  function motionFrame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - motion.last) / 1000));
    motion.last = now;
    if (now - motion.leanAt > LEAN_HOLD_MS) motion.lean.to = 0;
    stepSpring(motion.squash, dt);
    stepSpring(motion.lean, dt);
    if (motion.airborne) {
      motion.vy += motion.gravity * dt;
      motion.y += motion.vy * dt;
      if (motion.y >= 0) {            // 착지: 살짝 눌린다
        motion.y = 0;
        motion.vy = 0;
        motion.airborne = false;
        motion.squash.v -= KICK_LAND;
      }
    }
    const squash = Math.min(Math.max(motion.squash.x, SQUASH_MIN), SQUASH_MAX);
    const stretch = 1 / Math.sqrt(squash);       // 눌리면 옆으로 퍼진다
    // 3D 펫은 눌림과 기울임을 몸 자체에 반영하므로(frame3d) 여기서는 떠오르는 것만 옮긴다
    el.pet.style.transform = is3d()
      ? (motion.y ? `translateY(${motion.y.toFixed(2)}px)` : '')
      : `translateY(${motion.y.toFixed(2)}px) rotate(${motion.lean.x.toFixed(2)}deg) scale(${stretch.toFixed(4)}, ${squash.toFixed(4)})`;
    const resting = !motion.airborne && motion.lean.to === 0
      && Math.abs(motion.squash.x - 1) < 0.002 && Math.abs(motion.squash.v) < 0.02
      && Math.abs(motion.lean.x) < 0.05 && Math.abs(motion.lean.v) < 0.5;
    if (resting) {
      motion.frame = null;
      motion.squash.x = 1; motion.squash.v = 0;
      motion.lean.x = 0; motion.lean.v = 0;
      el.pet.style.transform = '';
      return;
    }
    motion.frame = requestAnimationFrame(motionFrame);
  }

  // 탄력 계산을 시작한다 (이미 돌고 있으면 그대로 둔다)
  function startMotion() {
    if (motion.frame || !smoothEnabled()) return;
    motion.last = performance.now();
    motion.frame = requestAnimationFrame(motionFrame);
  }

  // 몸을 한 번 눌렀다 튕긴다
  function squashKick(strength) {
    if (!smoothEnabled()) return;
    motion.squash.v -= strength;
    startMotion();
  }

  // 완료 점프: 움츠렸다가 떠올랐다 착지한다 (말풍선이 아래에 있는 배치에서는 위 공간이 없어 뛰지 않는다)
  function hopMotion() {
    if (!smoothEnabled()) return;
    squashKick(KICK_ANTICIPATE);
    clearTimeout(motion.hopTimer);
    if (layout.below) return;
    motion.hopTimer = setTimeout(() => {
      if (!smoothEnabled() || motion.airborne) return;
      const height = layout.petHeight * HOP_HEIGHT_RATIO;
      const air = HOP_AIR_MS / 1000;
      motion.gravity = (8 * height) / (air * air);
      motion.vy = -(motion.gravity * air) / 2;
      motion.airborne = true;
      startMotion();
    }, HOP_DELAY_MS);
  }

  // 끄는 속도에 맞춰 움직이는 쪽으로 기울인다
  function leanMotion(dx) {
    if (!smoothEnabled() || !Number.isFinite(dx)) return;
    const speed = dx / DRAG_TICK_S;
    motion.lean.to = Math.min(Math.max(speed * LEAN_PER_SPEED, -LEAN_MAX_DEG), LEAN_MAX_DEG);
    motion.leanAt = performance.now();
    startMotion();
  }

  // 애니메이션 하나를 재생한다. loop가 아니면 끝나고 onEnd를 부른다
  function play(id, loop, onEnd) {
    const anim = animations[id];
    clearTimeout(frameTimer);
    frameTimer = null;
    if (!anim || !sheetReady) { if (onEnd) onEnd(); return; }
    if (reducedMotion) { showCell(anim.row, 0, 0); if (!loop && onEnd) onEnd(); return; }
    let index = 0;
    const step = () => {
      const wait = anim.durations[index] || 140;
      showCell(anim.row, index, Math.min(FADE_MS, wait * FADE_RATIO));
      frameTimer = setTimeout(() => {
        index++;
        if (index >= anim.frames) {
          if (!loop) { frameTimer = null; if (onEnd) onEnd(); return; }
          index = 0;
        }
        step();
      }, wait);
    };
    step();
  }

  // 반복 애니메이션을 바꾼다 (같은 것이면 그대로 둔다)
  function ensureLoop(id) {
    if (loopId === id) return;
    loopId = id;
    play(id, true, null);
  }

  // 한 번만 재생하고 원래 상태로 돌아간다
  function playOnce(id) {
    if (is3d()) { if (!dragDirection) three.actor.playOnce(id); return; }
    if (dragDirection || !animations[id] || !sheetReady) return;
    oneShot = id;
    loopId = null;
    play(id, false, () => { oneShot = null; refreshAnimation(); });
  }

  // 지금 상태에 맞는 애니메이션을 고른다
  function refreshAnimation() {
    if (is3d()) { sync3d(); return; }
    if (!sheetReady) return;
    if (dragDirection) { oneShot = null; ensureLoop(dragDirection === 'right' ? 'running-right' : 'running-left'); return; }
    if (oneShot) return;
    const state = summary.primary ? summary.primary.state : 'idle';
    if (state === 'idle' && pet && pet.version === 2 && look.active) {
      // v2 펫: 커서 쪽을 바라보는 정지 그림
      clearTimeout(frameTimer);
      frameTimer = null;
      loopId = null;
      if (look.index == null) showCell(pet.neutralLook.row, pet.neutralLook.frame, LOOK_FADE_MS);
      else showCell(pet.lookFirstRow + Math.floor(look.index / pet.cols), look.index % pet.cols, LOOK_FADE_MS);
      return;
    }
    ensureLoop(BASE_ANIMATION[state] || 'idle');
  }

  // ── 펫 불러오기와 배치 ────────────────────────────────────
  // 말풍선·목록·크기 조절 창을 펫 가운데에 맞추되 창 밖으로 나가지 않게 한다
  function positionPanel() {
    rootStyle.setProperty('--panel-offset', `${layout.petHeight + PANEL_GAP_PX}px`);
    const width = el.panel.offsetWidth;
    if (!width) return;
    const stageWidth = window.innerWidth;
    const center = (layout.petLeft || 0) + layout.petWidth / 2;
    const maxLeft = Math.max(EDGE_MARGIN_PX, stageWidth - width - EDGE_MARGIN_PX);
    const left = Math.min(Math.max(center - width / 2, EDGE_MARGIN_PX), maxLeft);
    el.panel.style.left = `${Math.round(left)}px`;
    const tail = Math.min(Math.max(center - left, TAIL_MARGIN_PX), Math.max(TAIL_MARGIN_PX, width - TAIL_MARGIN_PX));
    el.bubble.style.setProperty('--tail-x', `${Math.round(tail)}px`);
  }

  // 펫 위치를 적용한다. resized면 크기와 시트 배율도 다시 맞춘다 (끌어서 옮기는 동안에는 위치만 바뀐다)
  function applyLayout(resized) {
    document.body.classList.toggle('below', !!layout.below);
    rootStyle.setProperty('--pet-left', `${layout.petLeft || 0}px`);
    if (resized) {
      el.pet.style.width = `${layout.petWidth}px`;
      el.pet.style.height = `${layout.petHeight}px`;
      if (pet && sheetReady) {
        for (const layer of el.layers) layer.style.backgroundSize = `${layout.petWidth * pet.cols}px ${layout.petHeight * pet.rows}px`;
      }
      stopFade();
      currentCell = '';          // 크기가 바뀌면 칸 위치를 다시 계산해야 한다
    }
    renderList();
    positionPanel();
  }

  // ── 3D 펫 ─────────────────────────────────────────────────
  // 지금 3D 펫을 그리고 있는지
  function is3d() {
    return !!pet && pet.type === '3d' && three.ready;
  }

  // 3D 그리기를 멈추고 캔버스를 숨긴다
  function stop3d() {
    if (three.frame) cancelAnimationFrame(three.frame);
    three.frame = null;
    three.ready = false;
    three.actor = null;
    three.basePixels = null;
    three.pixels = null;
    three.pendingColor = undefined;
    clearTimeout(three.iconTimer);
    el.canvas.hidden = true;
    // 직접 계산하던 깜빡임을 지우고 CSS 애니메이션에 돌려준다
    document.body.classList.remove('three');
    if (el.bubbleDot) el.bubbleDot.style.opacity = '';
    el.badge.style.transform = '';
  }

  // 말풍선 점과 배지의 깜빡임을 지금 시각에 맞춰 갱신한다 (3D를 그리는 순간에 함께 불러 화면 갱신 횟수를 늘리지 않는다)
  function syncBlink(now) {
    const t = now / 1000;
    const state = summary.primary ? summary.primary.state : 'idle';
    const wave = (period) => 0.5 - 0.5 * Math.cos((t / period) * Math.PI * 2);     // 0 → 1 → 0
    if (el.bubbleDot) {
      const pulsing = !reducedMotion && state === 'working' && !el.bubble.hidden;
      el.bubbleDot.style.opacity = pulsing ? (1 - (1 - BLINK.pulseLow) * wave(BLINK.pulseS)).toFixed(3) : '';
    }
    if (el.badge.hidden || reducedMotion) { el.badge.style.transform = ''; return; }
    el.badge.style.transform = state === 'waiting' ? `scale(${(1 + (BLINK.popScale - 1) * wave(BLINK.popS)).toFixed(3)})` : '';
    if (state !== 'working') return;
    const dots = el.badge.children;
    for (let i = 0; i < dots.length; i++) {
      const phase = (((t - i * BLINK.dotsDelayS) / BLINK.dotsS) % 1 + 1) % 1;
      const rise = phase < 0.3 ? phase / 0.3 : phase < 0.6 ? 1 - (phase - 0.3) / 0.3 : 0;     // 앞 60% 동안 솟았다 내려온다
      dots[i].style.opacity = (BLINK.dotsLow + (1 - BLINK.dotsLow) * rise).toFixed(3);
      dots[i].style.transform = `translateY(${(-BLINK.dotsRisePx * rise).toFixed(2)}px)`;
    }
  }

  // 3D 펫을 그릴 수 없을 때: 멈추고 본체에 알려 이미지 펫으로 바꾸게 한다
  function fail3d(key, reason) {
    console.error(`3D 펫을 그릴 수 없음 (${key}): ${reason}`);
    stop3d();
    if (api) api.renderError(key, reason);
  }

  // 몸 색을 바꾼다 (null이면 원래 색). 색 지도를 다시 계산해 올리고 눈 색도 맞춘다
  function applyColor(hex) {
    const rgb = hex ? PET3D.parseHexColor(hex) : null;
    const pixels = rgb ? PET3D.recolorMatcap(three.basePixels, three.size, rgb) : three.basePixels;
    three.renderer.setMatcap(pixels, three.size);
    three.renderer.setEyeColors(PET3D.eyeColorsFor(rgb));
    three.color = rgb ? hex : null;
    three.pixels = pixels;
    three.rgb = rgb;
    // 알림 영역 아이콘도 같은 색으로 바꾼다. 색을 끄는 동안에는 멈춘 뒤에 한 번만 보낸다
    clearTimeout(three.iconTimer);
    three.iconTimer = setTimeout(sendTrayIcon, TRAY_ICON_DELAY_MS);
  }

  // 지금 색의 펫 얼굴을 작은 그림으로 그려 본체에 보낸다 (알림 영역 아이콘용). 실패해도 펫에는 영향이 없다
  function sendTrayIcon() {
    if (!is3d() || !api || !three.pixels) return;
    let renderer = null;
    try {
      const canvas = document.createElement('canvas');
      renderer = PET3D.createRenderer(canvas, { preserveDrawingBuffer: true });
      renderer.setMatcap(three.pixels, three.size);
      renderer.setEyeColors(PET3D.eyeColorsFor(three.rgb));
      const model = three.actor.model;
      const pose = Object.assign({}, model.base, model.clips.idle.frames[0].pose, { laptop: 0 });
      renderer.draw(pose, model.shape, TRAY_RENDER_SCALE, SUPERSAMPLE_3D + 1);
      const region = PET3D.iconRegion(pose, model.shape);
      const icon = document.createElement('canvas');
      icon.width = TRAY_ICON_PX;
      icon.height = TRAY_ICON_PX;
      const ctx = icon.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, region.x * TRAY_RENDER_SCALE, region.y * TRAY_RENDER_SCALE, region.size * TRAY_RENDER_SCALE, region.size * TRAY_RENDER_SCALE, 0, 0, TRAY_ICON_PX, TRAY_ICON_PX);
      api.trayIcon(icon.toDataURL('image/png'));
    } catch (e) {
      console.warn(`알림 영역 아이콘 그림 만들기 실패: ${e.message}`);
    } finally {
      // 아이콘을 그리려고 잠깐 만든 그리기 도구는 바로 돌려준다
      try {
        const lose = renderer && renderer.gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      } catch (_) { /* 이미 정리됨 */ }
    }
  }

  // 본체가 알려 준 색(펫 꾸미기 창에서 고른 색)을 입힌다. 실제 계산은 다음 그릴 때 한 번만 한다
  function onColor(hex) {
    if (!is3d()) return;
    three.pendingColor = typeof hex === 'string' && PET3D.parseHexColor(hex) ? hex : null;
  }

  // 앱 상태(작업 중·끌기·커서 위치)를 3D 동작 재생기에 알린다
  function sync3d() {
    if (!is3d()) return;
    const state = summary.primary ? summary.primary.state : 'idle';
    three.actor.setBase(BASE_ANIMATION[state] || 'idle');
    three.actor.setDrag(dragDirection);
    three.actor.setLook({ active: look.active && state === 'idle', dx: look.dx, dy: look.dy });
    three.actor.setStill(reducedMotion);
  }

  // 3D 펫의 한 프레임. 평소에는 천천히, 움직임이 있을 때만 자주 그린다
  function frame3d(now) {
    three.frame = requestAnimationFrame(frame3d);
    if (!is3d()) return;
    const busy = three.actor.isBusy() || motion.frame !== null || three.pendingColor !== undefined;
    const interval = 1000 / (busy ? three.fps.busy : three.fps.idle);
    if (now - three.lastDraw < interval - FRAME_SLACK_MS) return;
    const dt = three.lastDraw ? now - three.lastDraw : 0;
    three.lastDraw = now;
    const key = pet.key;
    try {
      if (three.pendingColor !== undefined) {
        const wanted = three.pendingColor;
        three.pendingColor = undefined;
        applyColor(wanted);
      }
      // 탄력(눌림, 기울임)은 몸 자체에 반영한다. 기울임은 각도를 "높이 1당 옆으로 밀리는 양"으로 바꾼다
      const springy = smoothEnabled();
      three.actor.setMotion({
        squash: springy ? Math.min(Math.max(motion.squash.x, SQUASH_MIN), SQUASH_MAX) : 1,
        lean: springy ? Math.tan(motion.lean.x * Math.PI / 180) : 0,
      });
      const pose = three.actor.update(dt);
      const scale = (layout.petWidth / PET3D.CELL_W) * (window.devicePixelRatio || 1);
      three.renderer.draw(pose, three.actor.model.shape, scale, SUPERSAMPLE_3D);
      syncBlink(now);
      three.lastPose = pose;
      three.drawn++;
      three.errors = 0;
      // 점검용: 지난번 확인 뒤로 몸이 가장 많이 눌리고 늘어나고 기울고 떠오른 값을 기억해 둔다
      const seen = three.seen;
      seen.minSy = Math.min(seen.minSy, pose.sy); seen.maxSy = Math.max(seen.maxSy, pose.sy);
      seen.maxShear = Math.max(seen.maxShear, Math.abs(pose.shear));
      seen.maxLiftPx = Math.max(seen.maxLiftPx, -motion.y);
      seen.maxSmile = Math.max(seen.maxSmile, pose.smile); seen.maxLid = Math.max(seen.maxLid, pose.lid);
      seen.minOpen = Math.min(seen.minOpen, pose.open);
    } catch (e) {
      three.errors++;
      if (three.errors >= MAX_3D_ERRORS) fail3d(key, `그리는 중 오류: ${e.message}`);
    }
  }

  // 3D 펫을 불러온다: 그리기 도구와 동작 재생기를 만들고 색 지도를 올린다. 실패하면 본체에 알린다
  function load3d(next) {
    const key = next.key;
    try {
      if (!window.PET3D) throw new Error('3D 그리기 파일(pet3d.js)을 불러오지 못함');
      if (!three.renderer) three.renderer = PET3D.createRenderer(el.canvas);
      if (!three.lostBound) {
        three.lostBound = true;
        el.canvas.addEventListener('webglcontextlost', (event) => {
          event.preventDefault();
          three.renderer = null;          // 다음에 3D 펫을 불러올 때 새로 만든다
          if (pet && pet.type === '3d') fail3d(pet.key, '그래픽 장치 연결이 끊김');
        });
      }
      three.actor = PET3D.createActor(next.model);
    } catch (e) {
      fail3d(key, e.message);
      return;
    }
    three.fps = next.fps && next.fps.idle > 0 && next.fps.busy > 0 ? { idle: next.fps.idle, busy: next.fps.busy } : DEFAULT_FPS_3D;
    const image = new Image();
    image.onload = () => {
      if (!pet || pet.key !== key) return;       // 불러오는 사이 다른 펫으로 바뀜
      try {
        const size = image.naturalWidth;
        if (!size || size !== image.naturalHeight) throw new Error(`색 지도가 정사각형이 아님 (${image.naturalWidth}x${image.naturalHeight})`);
        const scratch = document.createElement('canvas');
        scratch.width = size; scratch.height = size;
        const ctx = scratch.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(image, 0, 0);
        three.basePixels = ctx.getImageData(0, 0, size, size).data;
        three.size = size;
        try {
          applyColor(typeof next.color === 'string' ? next.color : null);
        } catch (e) {
          console.warn(`저장된 색을 입히지 못해 원래 색으로 표시함: ${e.message}`);
          applyColor(null);
        }
        three.ready = true;
        three.errors = 0;
        three.lastDraw = 0;
        document.body.classList.add('three');
        el.petEmpty.hidden = true;
        el.canvas.hidden = false;
        applyLayout(true);
        sync3d();
        if (!greeted) { greeted = true; playOnce('waving'); }
        if (!three.frame) three.frame = requestAnimationFrame(frame3d);
      } catch (e) {
        fail3d(key, e.message);
      }
    };
    image.onerror = () => fail3d(key, '색 지도 그림을 읽지 못함');
    image.src = next.matcapUrl;
  }

  // 점검용: 3D 펫의 현재 상태를 돌려준다 (이미지 펫이면 null)
  window.petDebug = function () {
    if (!is3d()) return null;
    const p = three.lastPose || {};
    const fixed = (v) => (Number.isFinite(v) ? Math.round(v * 1000) / 1000 : null);
    const seen = three.seen;
    three.seen = newSeen();
    return {
      clip: three.actor.clipName(), busy: three.actor.isBusy(), drawn: three.drawn, color: three.color || 'original',
      canvas: [el.canvas.width, el.canvas.height], smooth: smoothEnabled(),
      yaw: fixed(p.yaw), pitch: fixed(p.pitch), laptop: fixed(p.laptop),
      // 지난번 확인 뒤로의 범위: 세로 배율, 기울임, 떠오른 높이, 표정
      sy: [fixed(seen.minSy), fixed(seen.maxSy)], maxShear: fixed(seen.maxShear), maxLiftPx: fixed(seen.maxLiftPx),
      minOpen: fixed(seen.minOpen), maxSmile: fixed(seen.maxSmile), maxLid: fixed(seen.maxLid),
    };
  };

  // 새 펫을 불러온다 (이미지 펫이면 시트를, 3D 펫이면 동작 자료와 색 지도를). 실패하면 본체에 알린다
  function loadPet(next) {
    clearTimeout(frameTimer);
    frameTimer = null;
    loopId = null;
    oneShot = null;
    sheetReady = false;
    stop3d();
    pet = next;
    animations = {};
    stopFade();
    currentCell = '';
    const sprite = !pet || pet.type !== '3d';
    for (const layer of el.layers) layer.style.display = sprite ? '' : 'none';
    if (pet && pet.type === '3d') {
      for (const layer of el.layers) layer.style.backgroundImage = 'none';
      if (!pet.model || typeof pet.matcapUrl !== 'string') { fail3d(pet.key, '3D 펫 자료가 비어 있음'); return; }
      load3d(pet);
      return;
    }
    if (!pet) {
      el.petEmpty.hidden = false;
      for (const layer of el.layers) layer.style.backgroundImage = 'none';
      applyLayout(true);
      return;
    }
    for (const a of pet.animations || []) animations[a.id] = a;
    const image = new Image();
    const key = pet.key;
    image.onload = () => {
      if (!pet || pet.key !== key) return;       // 불러오는 사이 다른 펫으로 바뀜
      el.petEmpty.hidden = true;
      for (const layer of el.layers) layer.style.backgroundImage = `url("${pet.sheetUrl}")`;
      sheetReady = true;
      applyLayout(true);
      refreshAnimation();
      if (!greeted) { greeted = true; playOnce('waving'); }
    };
    image.onerror = () => {
      console.error(`시트 이미지를 불러올 수 없음: ${key}`);
      if (api) api.sheetError(key, '이미지 불러오기 실패');
    };
    image.src = pet.sheetUrl;
  }

  // ── 말풍선과 목록 ─────────────────────────────────────────
  // 밀리초를 "3분 05초" 같은 글로 바꾼다
  function formatDuration(ms) {
    if (!Number.isFinite(ms) || ms < 0) return '';
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h > 0) return T('time.hm', h, String(m).padStart(2, '0'));
    if (m > 0) return T('time.ms', m, String(s).padStart(2, '0'));
    return T('time.s', s);
  }

  // 세션 하나의 시간 표시 (진행 중이면 경과, 끝났으면 소요)
  function timeText(view, now) {
    if (view.state === 'done' && Number.isFinite(view.durationMs)) return formatDuration(view.durationMs);
    if ((view.state === 'working' || view.state === 'waiting') && Number.isFinite(view.startedAt)) return formatDuration(now - view.startedAt);
    return '';
  }

  // 글 조각들을 가운뎃점으로 잇는다
  function joinParts(parts) {
    return parts.filter((p) => typeof p === 'string' && p).join(' · ');
  }

  // 말풍선 내용을 그린다
  function renderBubble() {
    const p = summary.primary;
    const labels = stateLabels();
    if (!p || !settings.bubble || listOpen) { el.bubble.hidden = true; return; }
    const now = Date.now();
    el.bubble.hidden = false;
    el.bubble.dataset.state = p.state;
    if (p.state === 'working') {
      el.bubbleText.textContent = p.detail || labels.working;
      el.bubbleSub.textContent = joinParts([p.title, timeText(p, now)]);
    } else if (p.state === 'waiting') {
      el.bubbleText.textContent = labels.waiting;
      el.bubbleSub.textContent = joinParts([p.detail, p.title]);
    } else if (p.state === 'done') {
      el.bubbleText.textContent = labels.done;
      el.bubbleSub.textContent = joinParts([p.title, timeText(p, now)]);
    } else {
      el.bubbleText.textContent = labels.failed;
      el.bubbleSub.textContent = joinParts([p.detail, p.title]);
    }
    const others = (summary.total || 0) - 1;
    el.bubbleMore.hidden = others <= 0;
    el.bubbleMore.textContent = others > 0 ? `+${others}` : '';
  }

  // 펫 머리 위 배지를 그린다
  function renderBadge() {
    const p = summary.primary;
    const bubbleShown = settings.bubble && !listOpen;
    if (!p || (p.state === 'working' && bubbleShown)) { el.badge.hidden = true; return; }
    el.badge.hidden = false;
    el.badge.dataset.state = p.state;
    el.badge.textContent = '';
    if (p.state === 'working') {
      for (let i = 0; i < 3; i++) el.badge.appendChild(document.createElement('i'));
    } else {
      el.badge.textContent = p.state === 'done' ? '✓' : '!';
    }
  }

  // 세션 목록을 그린다
  function renderList() {
    if (!listOpen) { el.list.hidden = true; return; }
    const labels = stateLabels();
    const now = Date.now();
    el.list.hidden = false;
    el.list.textContent = '';
    const title = document.createElement('div');
    title.className = 'list-title';
    const sessions = summary.sessions || [];
    title.textContent = sessions.length ? T('pet.listTitle', summary.total || sessions.length) : T('pet.listEmpty');
    el.list.appendChild(title);
    const room = Math.max(1, Math.floor(((layout.panelMaxHeight || 300) - LIST_CHROME_HEIGHT) / LIST_ROW_HEIGHT));
    for (const view of sessions.slice(0, room)) {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.state = view.state;
      row.title = T('pet.tipBubble');
      row.addEventListener('click', (e) => {
        e.stopPropagation();          // 목록 닫기 처리와 겹치지 않게 한다
        openSession(view.id);
      });
      const dot = document.createElement('span');
      dot.className = 'r-dot';
      const body = document.createElement('div');
      body.className = 'r-body';
      const name = document.createElement('div');
      name.className = 'r-title';
      name.textContent = view.title || T('session.untitled');
      const detail = document.createElement('div');
      detail.className = 'r-detail';
      detail.textContent = view.state === 'working' ? (view.detail || labels.working)
        : view.state === 'waiting' ? joinParts([labels.waiting, view.detail])
          : view.state === 'done' ? labels.done
            : joinParts([labels.failed, view.detail]);
      const time = document.createElement('span');
      time.className = 'r-time';
      time.textContent = timeText(view, now);
      body.appendChild(name);
      body.appendChild(detail);
      row.appendChild(dot);
      row.appendChild(body);
      row.appendChild(time);
      el.list.appendChild(row);
    }
  }

  // 화면 전체를 다시 그린다
  function renderAll() {
    renderBubble();
    renderBadge();
    renderList();
    positionPanel();
  }

  // ── 알림음 ────────────────────────────────────────────────
  // 짧은 음을 합성해 낸다 (소리 파일 없이 동작)
  function playSound(kind) {
    const notes = SOUNDS[kind];
    if (!settings.sound || !notes) return;
    try {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
      const base = audioContext.currentTime + 0.02;
      for (const [freq, at, length] of notes) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, base + at);
        gain.gain.linearRampToValueAtTime(SOUND_VOLUME, base + at + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, base + at + length);
        osc.connect(gain).connect(audioContext.destination);
        osc.start(base + at);
        osc.stop(base + at + length + 0.03);
      }
    } catch (e) {
      console.error(`알림음 재생 실패 (${kind}): ${e.message}`);
    }
  }

  // ── 마우스 처리 ───────────────────────────────────────────
  // 커서가 펫이나 말풍선 위에 있을 때만 클릭을 받는다
  function updateMouseIgnore(x, y) {
    if (!api || dragging) return;
    const target = document.elementFromPoint(x, y);
    const over = !!(target && target.closest && target.closest('.hit'));
    if (over === ignoringMouse) {
      ignoringMouse = !over;
      api.setIgnoreMouse(ignoringMouse);
    }
  }

  // 캐릭터를 (끌지 않고) 클릭했을 때: Claude를 연다
  function onPetClick() {
    if (api) api.openClaude();
    playOnce('waving');
    squashKick(KICK_CLICK);
  }

  // 세션을 Claude 앱에서 연다 (말풍선이나 목록 줄을 눌렀을 때)
  function openSession(id) {
    if (!api || typeof id !== 'string' || !id) return;
    api.openSession(id);
    if (listOpen) { listOpen = false; renderAll(); }
  }

  // 세션 목록을 여닫는다
  function toggleList() {
    listOpen = !listOpen;
    renderAll();
  }

  // 드래그를 끝낸다
  function endDrag() {
    dragging = false;
    dragDirection = null;
    el.pet.classList.remove('dragging');
    if (api) api.dragEnd();
    loopId = null;
    refreshAnimation();
    motion.lean.to = 0;            // 놓으면 기울임이 풀리며 출렁인다
    squashKick(KICK_RELEASE);
  }

  window.addEventListener('mousemove', (e) => updateMouseIgnore(e.clientX, e.clientY));
  document.addEventListener('mouseleave', () => {
    if (!api || dragging || ignoringMouse) return;
    ignoringMouse = true;
    api.setIgnoreMouse(true);
  });
  el.pet.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    try { el.pet.setPointerCapture(e.pointerId); } catch (_) { /* 캡처 실패해도 클릭은 동작 */ }
    pointerDown = { x: e.screenX, y: e.screenY, moved: false };
  });
  el.pet.addEventListener('pointermove', (e) => {
    if (!pointerDown || pointerDown.moved) return;
    if (Math.hypot(e.screenX - pointerDown.x, e.screenY - pointerDown.y) < DRAG_THRESHOLD_PX) return;
    pointerDown.moved = true;
    dragging = true;
    el.pet.classList.add('dragging');
    if (api) api.dragStart();
  });
  el.pet.addEventListener('pointerup', (e) => {
    if (e.button !== 0 || !pointerDown) return;
    const moved = pointerDown.moved;
    pointerDown = null;
    if (moved) endDrag();          // 끌어서 옮긴 경우에는 클릭으로 치지 않는다
    else onPetClick();
  });
  el.pet.addEventListener('pointercancel', () => {
    if (!pointerDown) return;
    const moved = pointerDown.moved;
    pointerDown = null;
    if (moved) endDrag();
  });
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (api && e.target && e.target.closest && e.target.closest('.hit')) api.contextMenu();
  });
  el.bubble.addEventListener('click', () => { if (summary.primary) openSession(summary.primary.id); });
  el.bubbleMore.addEventListener('click', (e) => { e.stopPropagation(); toggleList(); });
  el.list.addEventListener('click', () => { listOpen = false; renderAll(); });

  // ── 본체와 연결 ───────────────────────────────────────────
  if (!api) {
    console.error('본체와 연결할 수 없음 (petApi 없음)');
    loadPet(null);
    return;
  }
  api.onSettings((next) => {
    if (!next || typeof next !== 'object') return;
    settings = Object.assign({}, settings, next);
    if (!smoothEnabled()) { stopFade(); resetMotion(); }
    applyTexts();
    renderAll();
  });
  api.onLayout((next) => {
    if (!next || !Number.isFinite(next.petWidth) || !Number.isFinite(next.petHeight)) return;
    const resized = next.petWidth !== layout.petWidth || next.petHeight !== layout.petHeight;
    layout = Object.assign({}, layout, next);
    applyLayout(resized);
    // 크기가 바뀐 경우에만 애니메이션을 다시 시작한다 (위치만 바뀔 때 다시 시작하면 끄는 동안 첫 프레임에 멈춘다)
    if (resized && sheetReady) { loopId = null; refreshAnimation(); }
  });
  api.onPet((next) => loadPet(next && typeof next === 'object' ? next : null));
  api.onState((next) => {
    summary = next && typeof next === 'object' ? Object.assign({}, EMPTY_SUMMARY, next) : EMPTY_SUMMARY;
    if (next && next.demoOpenList) listOpen = true;
    renderAll();
    refreshAnimation();
  });
  api.onNotify((note) => {
    if (!note || typeof note !== 'object') return;
    playSound(note.kind);
    if (note.kind === 'done') { playOnce('jumping'); hopMotion(); }
    else if (note.kind === 'waiting') { playOnce('waving'); squashKick(KICK_NOTICE); }
  });
  api.onLook((next) => {
    if (!next || typeof next !== 'object') return;
    look = {
      active: !!next.active, index: Number.isInteger(next.index) ? next.index : null,
      dx: Number.isFinite(next.dx) ? next.dx : 0, dy: Number.isFinite(next.dy) ? next.dy : 0,
    };
    refreshAnimation();
  });
  api.onDragMove((move) => {
    if (!dragging || !move || (move.direction !== 'left' && move.direction !== 'right')) return;
    leanMotion(move.dx);
    if (dragDirection === move.direction) return;
    dragDirection = move.direction;
    refreshAnimation();
  });
  api.onColor(onColor);
  api.onToggleList(toggleList);
  setInterval(() => { if (summary.primary) { renderBubble(); if (listOpen) renderList(); positionPanel(); } }, CLOCK_MS);
  stopFade();                    // 처음에는 첫 번째 겹만 보이게 한다
  applyLayout(true);
  api.ready();
})();
</script>
</body>
</html>
